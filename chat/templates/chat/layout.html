{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Zuetta {% block title %}{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
        <style>{% block style %}{% endblock %}</style>
    </head>
    <body class="m-5">
        <!--Just the name-->
        <h1 class="text-center">Zuetta Chats</h1>

        <!--Some links to other part of the sites-->
        {% if user.is_authenticated %}
        <nav class="d-flex justify-content-between">
            <div class="mt-3 mb-2">
                <a class="btn btn-sm btn-outline-secondary mt-2" href="{% url 'home' %}">Home</a>
                <a class="btn btn-sm btn-outline-secondary mt-2" href="{% url 'create' %}">Create</a>
                <a class="btn btn-sm btn-outline-secondary mt-2" href="{% url 'join' %}">Join</a>
                <a class="btn btn-sm btn-outline-secondary mt-2" href="{% url 'logout' %}">Log Out</a>
            </div>
            
            <!--username of the curent user-->
            <p class="text-dark m-2">Logged in as <strong>{{ request.user.username }}</strong></p>
         </nav>
        {% endif %}
            {% block body %}
            {% endblock %}
    </body>
</html>
